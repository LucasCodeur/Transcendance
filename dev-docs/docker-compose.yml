services:
  postgres:
    image: postgres:17
    restart: always
    container_name: postgres
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    #user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendance

volumes:
  postgres_data:
    name: postgres_data
    driver_opts:
      type: "none"
      o: "bind"
      device: "${PWD}/db"

networks:
  transcendance:
    name: transcendance
